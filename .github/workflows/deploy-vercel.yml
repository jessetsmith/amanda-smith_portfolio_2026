# Optional Actions deploy via Vercel CLI.
# Primary production path is the Vercel Git integration (auto-deploys on push to main).
# This workflow only runs when VERCEL_TOKEN + org/project ids are set as Actions secrets.

name: Deploy Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Deploy (${{ github.event_name == 'pull_request' && 'preview' || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Vercel secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel Actions deploy skipped"
              echo ""
              echo "Missing secrets:$missing"
              echo ""
              echo "Production is deployed by the **Vercel Git integration** on push to \`main\`."
              echo "To enable this CLI workflow, add the secrets (see \`.github/DEPLOY.md\`)."
              echo "Live: https://portfolio.bittersweetwoman.com/"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Skipping Actions Vercel CLI deploy (secrets missing). Vercel Git integration handles production."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.secrets.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.secrets.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Vercel CLI
        if: steps.secrets.outputs.skip != 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.secrets.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          fi

      - name: Build (Vercel)
        if: steps.secrets.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vercel build --token="$VERCEL_TOKEN"
          else
            vercel build --prod --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        if: steps.secrets.outputs.skip != 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Summary
        if: steps.secrets.outputs.skip != 'true'
        run: |
          {
            echo "## Vercel deploy"
            echo ""
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
            echo "- **Custom domain:** https://portfolio.bittersweetwoman.com/"
            echo "- **Admin:** https://portfolio.bittersweetwoman.com/admin"
          } >> "$GITHUB_STEP_SUMMARY"
